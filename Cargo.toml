[package]
name = "msty_studio"
version = "0.1.0"
edition = "2021"
description = "Cliente de chat ligero y nativo para APIs OpenAI-compatible"
license = "MIT"

[dependencies]
eframe = "0.32"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
