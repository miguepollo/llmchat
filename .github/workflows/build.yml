# Genera binarios de release para Linux, Windows y macOS de forma nativa.
# - Linux: ubuntu (glibc) y musl estático (x86_64)
# - Windows: x86_64 MSVC
# - macOS: x86_64 y Apple Silicon (aarch64)
#
# Se ejecuta al hacer push a la rama principal, en pull requests y al
# crear una etiqueta v*.
# - Cada push a main: los binarios se suben como artefactos y se publica/actualiza
#   un Release continuo llamado "Continuous build" (prerelease).
# - Etiqueta v*: se publica un Release versionado con los binarios.
# - Pull requests: solo artefactos (sin release).

name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64-gnu
            distro: apt
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64-musl
            distro: apt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Dependencias de sistema necesarias para compilar eframe/winit.
      - name: Instalar dependencias de sistema (Linux)
        if: matrix.distro == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev \
            libgl1-mesa-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev 

      # Toolchain C cruzada para el target estático musl: proporciona
      # `x86_64-linux-musl-gcc` (necesaria para compilar `ring` y enlazar).
      - name: Instalar toolchain musl (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compilar (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empaquetar binario
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/llmchat.exe" "dist/llmchat-${{ matrix.name }}.exe"
          else
            cp "target/${{ matrix.target }}/release/llmchat" "dist/llmchat-${{ matrix.name }}"
          fi

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: llmchat-${{ matrix.name }}
          path: dist/

  # Reúne los binarios de todos los builds y publica (o actualiza) un Release.
  # - En cada push a main: "Continuous build" (prerelease, siempre disponible).
  # - En etiquetas v*: Release versionado con los binarios.
  publish:
    name: Publicar release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: llmchat-*
          path: dist
          merge-multiple: true

      - name: Determinar release (versionada o continua)
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "body=Publicado automáticamente desde ${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=continuous" >> "$GITHUB_OUTPUT"
            echo "name=Continuous build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "body=Binarios del último commit en main (${GITHUB_SHA:0:7}). Usa una etiqueta v* para publicar un release estable." >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar / actualizar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: dist/*
          body: ${{ steps.meta.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          update_release: true
          fail_on_unmatched_files: false